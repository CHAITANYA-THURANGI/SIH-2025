<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brain, Fun and BOOM! - Login</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --royal-purple: #6a4c93;
            --royal-blue: #1982c4;
            --royal-gold: #ffca3a;
            --royal-red: #ff595e;
            --royal-green: #8ac926;
            --dark-blue: #0a2342;
            --light-bg: #f0f7ff;
        }

        body {
            background: linear-gradient(135deg, var(--royal-blue) 0%, var(--royal-purple) 100%);
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 450px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .logo {
            text-align: center;
            margin-bottom: 30px;
        }

        .logo h1 {
            font-size: 2.8rem;
            font-weight: 800;
            background: linear-gradient(to right, var(--royal-gold), var(--royal-red));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 2px 4px rgba(0, 0, 0, 0.2);
        }

        .logo p {
            color: white;
            font-size: 1.2rem;
            margin-top: 10px;
        }

        .form-container {
            width: 100%;
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-weight: 600;
            color: var(--royal-gold);
            font-size: 1.8rem;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 500;
            color: white;
        }

        .input-group input {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .input-group input:focus {
            outline: none;
            box-shadow: 0 0 0 3px var(--royal-gold);
            transform: translateY(-2px);
        }

        .btn {
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(to right, var(--royal-gold), var(--royal-red));
            color: var(--dark-blue);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
            margin-top: 10px;
        }

        .btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 25px 0;
            color: white;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: rgba(255, 255, 255, 0.3);
        }

        .divider span {
            padding: 0 15px;
            font-size: 0.9rem;
        }

        .social-login {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .social-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            border: none;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.9);
            font-size: 1rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
        }

        .social-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }

        .social-btn.apple {
            background: #000;
            color: white;
        }

        .terms {
            text-align: center;
            margin-top: 30px;
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.8);
            line-height: 1.5;
        }

        .terms a {
            color: var(--royal-gold);
            text-decoration: none;
        }

        .animation-container {
            position: absolute;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .bubble {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.1);
            animation: float 15s infinite ease-in-out;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0) rotate(0deg);
            }
            50% {
                transform: translateY(-20px) rotate(180deg);
            }
        }

        @media (max-width: 500px) {
            .container {
                padding: 30px 20px;
            }
            
            .logo h1 {
                font-size: 2.2rem;
            }
        }
    </style>
</head>
<body>
    <div class="animation-container" id="animation-container"></div>
    
    <div class="container">
        <div class="logo">
            <h1>Brain, Fun and BOOM!</h1>
            <p>Gamified Learning for Rural Education</p>
        </div>
        
        <div class="form-container">
            <h2>Create an account</h2>
            <p style="text-align: center; margin-bottom: 20px; color: rgba(255, 255, 255, 0.9);">
                Enter your email to sign up for this app
            </p>
            
            <div class="input-group">
                <label for="email">Email</label>
                <input type="email" id="email" placeholder="email@domain.com">
            </div>
            
            <button class="btn">Continue</button>
            
            <div class="divider">
                <span>Or</span>
            </div>
            
            <div class="social-login">
                <button class="social-btn">
                    <i class="fab fa-google" style="color: #DB4437;"></i>
                    Continue with Google
                </button>
                <button class="social-btn apple">
                    <i class="fab fa-apple"></i>
                    Continue with Apple
                </button>
            </div>
            
            <div class="terms">
                By clicking continue, you agree to our <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>
            </div>
        </div>
    </div>

    <script>
        // Create floating bubbles for background animation
        document.addEventListener('DOMContentLoaded', function() {
            const container = document.getElementById('animation-container');
            const colors = [
                'rgba(255, 202, 58, 0.2)', 
                'rgba(255, 89, 94, 0.2)', 
                'rgba(138, 201, 38, 0.2)',
                'rgba(25, 130, 196, 0.2)',
                'rgba(106, 76, 147, 0.2)'
            ];
            
            for (let i = 0; i < 15; i++) {
                const bubble = document.createElement('div');
                bubble.classList.add('bubble');
                
                // Random properties
                const size = Math.random() * 60 + 20;
                const color = colors[Math.floor(Math.random() * colors.length)];
                
                // Apply styles
                bubble.style.width = `${size}px`;
                bubble.style.height = `${size}px`;
                bubble.style.background = color;
                bubble.style.left = `${Math.random() * 100}%`;
                bubble.style.top = `${Math.random() * 100}%`;
                bubble.style.animationDelay = `${Math.random() * 10}s`;
                bubble.style.animationDuration = `${15 + Math.random() * 15}s`;
                
                container.appendChild(bubble);
            }
        });
    </script>
</body>
</html>
